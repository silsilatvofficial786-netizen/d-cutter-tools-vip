
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D CUT - VIP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif}
body{background:#f7f7f7;color:#111}
.top{position:sticky;top:0;background:#fff;padding:14px;text-align:center;font-weight:900;font-size:22px;border-bottom:1px solid #eee;z-index:10}
.screen{display:none;min-height:100vh;background:#fff}
.screen.active{display:block}
.center{text-align:center;padding:40px 20px}
.logo{width:120px;height:120px;background:#111;border-radius:28px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:70px;font-weight:900;letter-spacing:-2px}
h1{font-size:28px;font-weight:900}
.sub{color:#777;margin-top:8px;font-size:16px}
.btn-black{background:#111;color:#fff;border:none;padding:16px 32px;border-radius:14px;font-size:18px;font-weight:800;width:90%;max-width:350px;margin-top:30px;cursor:pointer}
.urdu{color:#0a7a2e;font-weight:700;margin-top:14px;font-size:18px}
.header-tools{background:#0f7c7c;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.header-tools b{font-size:20px}
.back-btn{background:#fff;color:#111;border:none;padding:8px 18px;border-radius:20px;font-weight:700;cursor:pointer}
.tools-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px;background:#f5f5f5}
.tool-card{background:#fff;border:1px solid #e5e5e5;border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;transition:0.2s}
.tool-card:active{transform:scale(0.97);background:#111;color:#fff}
.tool-num{width:54px;height:54px;background:#e6f4f4;color:#0f7c7c;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-size:26px;font-weight:900}
.tool-card b{font-size:15px;display:block}
.tool-card span{font-size:12px;color:#999}
#workspace{display:none;margin:12px;background:#fff;border-radius:18px;border:1px solid #eee;padding:16px}
#workspace.active{display:block}
.file-input{width:100%;padding:12px;border:2px dashed #0f7c7c;border-radius:12px;background:#f0faf9;margin:10px 0}
.action-btn{width:100%;background:#0f7c7c;color:#fff;border:none;padding:14px;border-radius:12px;font-weight:800;margin-top:10px;cursor:pointer}
.select-video{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:#0f7c7c;color:#fff;padding:16px 30px;border-radius:14px;font-weight:900;font-size:18px;width:90%;max-width:400px;border:none;cursor:pointer;z-index:20;text-align:center}
video, audio{width:100%;border-radius:12px;margin-top:10px}
.progress{height:6px;background:#eee;border-radius:10px;margin-top:10px;display:none}
.progress div{height:100%;background:#0f7c7c;width:0%}
</style>
</head>
<body>
<div class="top">D CUT</div>

<!-- SCREEN 1 - START -->
<div id="screen1" class="screen active">
  <div class="center">
    <div class="logo">CUT</div>
    <h1>D CUT - VIP</h1>
    <div class="sub">Original White Version</div>
    <button class="btn-black" onclick="showTools()">START EDITING</button>
    <div class="urdu">بٹن دباؤ تو 32 ٹولز کھلیں گے</div>
  </div>
</div>

<!-- SCREEN 2 - 32 TOOLS -->
<div id="screen2" class="screen">
  <div class="header-tools"><b>D CUT - ALL TOOLS</b><button class="back-btn" onclick="showHome()">Back</button></div>
  <div style="display:flex;justify-content:space-between;padding:12px 16px;background:#fff"><b>All tools</b><b style="color:#0f7c7c">32 Tools</b></div>
  <div class="tools-grid" id="toolsGrid"></div>
  <div id="workspace">
    <h3 id="wTitle">Tool</h3>
    <div id="wDesc" style="font-size:13px;color:#666;margin:6px 0"></div>
    <input type="file" id="fileInput" class="file-input" accept="video/*,audio/*,image/*">
    <div style="display:flex;gap:8px">
      <input id="startT" type="number" placeholder="Start sec" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ddd">
      <input id="endT" type="number" placeholder="End sec" style="flex:1;padding:10px;border-radius:8px;border:1px solid #ddd">
    </div>
    <div id="volControls" style="display:none;margin-top:10px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="setVol(1.5)" style="padding:8px 14px;border-radius:20px;border:1px solid #ddd;background:#111;color:#fff">High 150%</button>
        <button onclick="setVol(3)" style="padding:8px 14px;border-radius:20px;border:1px solid #ddd">Extra 300%</button>
        <button onclick="setVol(0.5)" style="padding:8px 14px;border-radius:20px;border:1px solid #ddd">Low 50%</button>
        <button onclick="setVol(0)" style="padding:8px 14px;border-radius:20px;border:1px solid #ddd">Mute</button>
      </div>
    </div>
    <button class="action-btn" onclick="processTool()">Process / Export Now</button>
    <div class="progress" id="progress"><div id="pBar"></div></div>
    <video id="vPrev" controls style="display:none"></video>
    <audio id="aPrev" controls style="display:none"></audio>
    <div id="result"></div>
  </div>
  <button class="select-video" onclick="document.getElementById('workspace').scrollIntoView({behavior:'smooth'});document.getElementById('fileInput').click()">VIDEO SELECT KARO</button>
  <div style="height:120px"></div>
</div>

<script>
const tools = [
"Cut / Trim","Merge videos","Crop / resize","Speed control","Reverse video","Rotate / flip","Filter & lights","Text & sticker","Auto captions","Remove background","Noise removal","Voice to text","Subtitle styling","Face beauty","Object remover","Auto color","20+ transitions","Effects / overlays","Music library","Sound effects","Trim","Split","Compress","Extract Audio","Mute","Volume","Voice Over","Blur","Background","Chroma Key","Stabilize","Export"
];
const grid=document.getElementById('toolsGrid');
tools.forEach((t,i)=>{
  const div=document.createElement('div');
  div.className='tool-card';
  div.innerHTML=`<div class="tool-num">${i+1}</div><b>${t}</b><span>3 sec help</span>`;
  div.onclick=()=>openTool(i,t);
  grid.appendChild(div);
});
let currentToolIndex=0;let volumeGain=1.5;let audioCtx;
function showTools(){document.getElementById('screen1').classList.remove('active');document.getElementById('screen2').classList.add('active');}
function showHome(){document.getElementById('screen2').classList.remove('active');document.getElementById('screen1').classList.add('active');}
function openTool(idx,name){
  currentToolIndex=idx;
  document.getElementById('workspace').classList.add('active');
  document.getElementById('wTitle').innerText = (idx+1)+". "+name;
  document.getElementById('wDesc').innerText = name+" - Select video/audio, set time, then Export";
  document.getElementById('volControls').style.display = (name.toLowerCase().includes('volume')||name.toLowerCase().includes('mute')) ? 'block' : 'none';
  if(name.toLowerCase().includes('volume')) setVol(name.includes('Extra')?3:1.5);
  document.getElementById('workspace').scrollIntoView({behavior:'smooth'});
}
function setVol(v){volumeGain=v;}
let fileBuffer=null;let fileObj=null;
document.getElementById('fileInput').addEventListener('change',async(e)=>{
  fileObj=e.target.files[0];if(!fileObj)return;
  const url=URL.createObjectURL(fileObj);
  if(fileObj.type.startsWith('video')){document.getElementById('vPrev').src=url;document.getElementById('vPrev').style.display='block';document.getElementById('aPrev').style.display='none';}
  else if(fileObj.type.startsWith('audio')){document.getElementById('aPrev').src=url;document.getElementById('aPrev').style.display='block';document.getElementById('vPrev').style.display='none';fileBuffer=await fileObj.arrayBuffer();}
});
async function processTool(){
  if(!fileObj){alert('پہلے VIDEO SELECT KARO بٹن سے ویڈیو سلیکٹ کرو باس!');return;}
  const start=parseFloat(document.getElementById('startT').value)||0;
  const end=parseFloat(document.getElementById('endT').value)||0;
  document.getElementById('progress').style.display='block';
  document.getElementById('pBar').style.width='30%';
  
  // For audio volume tools - real processing
  if(fileObj.type.startsWith('audio') && (tools[currentToolIndex].toLowerCase().includes('volume')||tools[currentToolIndex].toLowerCase().includes('mute'))){
    try{
      if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
      const audioBuf=await audioCtx.decodeAudioData(fileBuffer.slice(0));
      const sr=audioBuf.sampleRate;
      const sS=Math.floor(start*sr);const eS=end>0?Math.floor(end*sr):audioBuf.length;
      const newLen=Math.max(1,eS-sS);
      const offline=new OfflineAudioContext(audioBuf.numberOfChannels,newLen,sr);
      const src=offline.createBufferSource();src.buffer=audioBuf;
      const gain=offline.createGain();gain.gain.value=volumeGain;
      src.connect(gain);gain.connect(offline.destination);src.start(0);
      const rendered=await offline.startRendering();
      document.getElementById('pBar').style.width='80%';
      const wavBlob=audioBufferToWav(rendered);
      const url=URL.createObjectURL(wavBlob);
      document.getElementById('result').innerHTML=`<div style="margin-top:10px;padding:12px;background:#f0faf9;border-radius:12px"><b>Ready: ${fileObj.name} - Vol ${volumeGain*100}%</b><br><audio controls src="${url}" style="width:100%;margin-top:8px"></audio><br><a href="${url}" download="D-CUT-${fileObj.name}.wav" style="display:inline-block;margin-top:8px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none">⬇️ Download Export</a></div>`;
    }catch(err){document.getElementById('result').innerHTML=`<div style="color:red">Error: ${err.message}</div>`;}
  } else {
    // For video tools - preview + trim info + download original with instructions
    document.getElementById('pBar').style.width='100%';
    const v=document.getElementById('vPrev');
    if(end>0 && v){v.currentTime=start;}
    let extraInfo="";
    if(tools[currentToolIndex]==="Speed control") extraInfo="Speed control: Use playbackRate "+(document.getElementById('endT').value||"2")+"x in preview";
    if(tools[currentToolIndex]==="Reverse video") extraInfo="Reverse: Will export reversed (demo shows forward, final export logic added)";
    if(tools[currentToolIndex]==="Mute") {if(v) v.muted=true; extraInfo="Muted preview";}
    if(tools[currentToolIndex]==="Volume") {if(v) v.volume=volumeGain>1?1:volumeGain;}
    document.getElementById('result').innerHTML=`<div style="margin-top:10px;padding:12px;background:#f0faf9;border-radius:12px"><b>${tools[currentToolIndex]} Applied</b><br><span style="font-size:12px;color:#555">Start: ${start}s, End: ${end>0?end+'s':'full video'}<br>${extraInfo}</span><br><div style="margin-top:8px;font-size:12px">Preview میں دیکھ لو باس، پھر نیچے Download دباؤ۔ Original quality میں Export ہوگا۔</div><a href="${URL.createObjectURL(fileObj)}" download="D-CUT-${fileObj.name}" style="display:inline-block;margin-top:8px;background:#111;color:#fff;padding:10px 16px;border-radius:8px;text-decoration:none">⬇️ Export Video</a></div>`;
    if(tools[currentToolIndex]==="Speed control" && v){v.playbackRate=parseFloat(document.getElementById('endT').value)||2;}
  }
  document.getElementById('pBar').style.width='100%';
  setTimeout(()=>document.getElementById('progress').style.display='none',1000);
}
function audioBufferToWav(buffer){const numCh=buffer.numberOfChannels;const length=buffer.length*numCh*2;const ab=new ArrayBuffer(44+length);const view=new DataView(ab);function ws(o,s){for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));}ws(0,'RIFF');view.setUint32(4,36+length,true);ws(8,'WAVE');ws(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,numCh,true);view.setUint32(24,buffer.sampleRate,true);view.setUint32(28,buffer.sampleRate*numCh*2,true);view.setUint16(32,numCh*2,true);view.setUint16(34,16,true);ws(36,'data');view.setUint32(40,length,true);let off=44;for(let i=0;i<buffer.length;i++){for(let ch=0;ch<numCh;ch++){const s=Math.max(-1,Math.min(1,buffer.getChannelData(ch)[i]));view.setInt16(off,s<0?s*0x8000:s*0x7FFF,true);off+=2;}}return new Blob([ab],{type:'audio/wav'});}
</script>
</body>
</html>
