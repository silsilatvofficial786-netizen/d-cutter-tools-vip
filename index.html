
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D CUT - VIP 32</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f2;color:#111}
.top{background:#fff;padding:12px;text-align:center;font-weight:900;font-size:22px;border-bottom:1px solid #ddd}
.top span{color:#00bfa6}
/* آپ والا اصلی لوگو - سفید ڈبہ + کالا D + کینچی */
.logo-box{text-align:center;padding:30px 15px 10px;background:#fff}
.logo-wrap{width:150px;height:150px;background:#fff;border-radius:35px;box-shadow:0 10px 25px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;overflow:hidden}
.logo-D{font-size:110px;font-weight:900;color:#111;line-height:1;letter-spacing:-5px;margin-top:5px}
.logo-scissor{position:absolute;top:48px;right:22px;font-size:38px;transform:rotate(-15deg);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.logo-cut{position:absolute;top:62px;right:38px;width:45px;height:3px;background:#fff;transform:rotate(-12deg);z-index:1}
.logo-box h1{margin-top:15px;font-size:26px}
.logo-box p{color:#666;margin-top:5px}
.btn{display:block;width:90%;margin:14px auto;padding:16px;background:#111;color:#fff;text-align:center;border-radius:14px;font-size:18px;font-weight:800;border:none;cursor:pointer}
.btn-teal{background:#00bfa6}
.btn-yellow{background:#ffcc00;color:#000}
.header{background:#00bfa6;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:900}
.tools{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.tool.active{border:3px solid #00bfa6;background:#e6fffa}
.tool b{display:block;margin-top:6px;font-size:14px}
.page{display:none}
.page.active{display:block}
#editor{background:#000;color:#fff;min-height:100vh;padding:12px;padding-bottom:40px}
video{width:100%;border-radius:14px;background:#222;max-height:55vh}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.controls button{padding:12px;border-radius:10px;border:none;background:#222;color:#fff;font-weight:700}
.controls button.on{background:#00bfa6;color:#fff}
input[type=range]{width:100%;margin-top:10px}
.text-input{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px}
select{width:100%;padding:12px;border-radius:10px;margin-top:10px}
.step-box{background:#1a1a1a;padding:12px;border-radius:12px;margin-top:12px;text-align:center}
.step-box b{color:#ffcc00}
.footer{padding:10px;text-align:center;color:#888;font-size:12px}
#status{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#00bfa6;color:#fff;padding:10px 18px;border-radius:20px;font-weight:800;display:none;z-index:99}
.mini-logo{width:38px;height:38px;background:#fff;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;position:relative;overflow:hidden;vertical-align:middle}
.mini-logo span{font-size:26px;font-weight:900;color:#111}
.mini-logo i{position:absolute;top:10px;right:2px;font-size:13px;font-style:normal}
</style>
</head>
<body>
<div id="status"></div>

<!-- ہوم - آپ والا لوگو -->
<div id="home" class="page active">
  <div class="top"><span class="mini-logo"><span>D</span><i>✂️</i></span> D <span>CUT</span></div>
  <div class="logo-box">
    <div class="logo-wrap">
      <div class="logo-D">D</div>
      <div class="logo-cut"></div>
      <div class="logo-scissor">✂️</div>
    </div>
    <h1>D CUT - VIP</h1>
    <p>Original White Version | 32 Tools | آپ والا اصلی لوگو</p>
  </div>
  <button class="btn" onclick="showPage('tools')">START EDITING ▶</button>
  <button class="btn btn-teal" onclick="showPage('tools')">32 ٹولز دیکھیں</button>
  <div class="footer">D CUT VIP 32 - آپ کی اپنی ایڈیٹنگ ایپ</div>
</div>

<!-- ٹولز -->
<div id="tools" class="page">
  <div class="header">D CUT - ALL TOOLS | پہلے ٹول چنیں</div>
  <div class="tools" id="toolGrid"></div>
  <button class="btn btn-teal" onclick="document.getElementById('videoInput').click()">VIDEO SELECT KARO 📹</button>
  <input type="file" id="videoInput" accept="video/*" hidden onchange="loadVideo(event)">
  <button class="btn" onclick="showPage('home')">واپس ہوم پر</button>
</div>

<!-- ایڈیٹر -->
<div id="editor" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center"><b><span class="mini-logo"><span>D</span><i>✂️</i></span> D CUT</b><button onclick="showPage('tools')" style="background:#00bfa6;border:none;padding:8px 14px;border-radius:8px;color:#fff">بند کریں</button></div>

  <div class="step-box">سٹیپ: <b id="stepText">1 - ویڈیو لگائیں</b><br><small id="currentToolText">کوئی ٹول نہیں چنا</small></div>

  <div style="position:relative;margin-top:12px">
    <video id="myVideo" controls playsinline></video>
    <div id="overlayText" style="position:absolute;bottom:30px;left:0;right:0;text-align:center;font-size:28px;font-weight:900;color:yellow;text-shadow:2px 2px 4px #000;pointer-events:none">❤️ سبحان اللہ</div>
  </div>

  <input class="text-input" id="textInput" placeholder="یہاں اردو / انگلش لکھیں..." oninput="document.getElementById('overlayText').innerText=this.value">

  <label style="display:block;margin-top:12px">1 - ٹرم / کٹ</label>
  <input type="range" id="trimStart" min="0" max="100" value="0" oninput="doTrim()">
  <input type="range" id="trimEnd" min="0" max="100" value="100" oninput="doTrim()">
  <small id="trimLabel">0s سے 0s تک</small>

  <label style="display:block;margin-top:12px">2 - اسپیڈ</label>
  <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="changeSpeed(this.value);showMsg('اسپیڈ بدل گئی');goNext('اسپیڈ ہو گئی، اب فلٹر چنیں')">
  <small id="speedLabel">اسپیڈ: 1x</small>

  <label style="display:block;margin-top:14px">3 - فلٹر</label>
  <div class="controls">
    <button onclick="setFilter('none',this)">اصل</button>
    <button onclick="setFilter('grayscale(1)',this)">کالا سفید</button>
    <button onclick="setFilter('sepia(0.8)',this)">سنہری</button>
    <button onclick="setFilter('contrast(1.4) saturate(1.5)',this)">چمکدار</button>
    <button onclick="setFilter('blur(2px)',this)">بلر</button>
    <button onclick="setFilter('brightness(1.3)',this)">روشن</button>
  </div>

  <label style="display:block;margin-top:14px">4 - کنٹرول</label>
  <div class="controls">
    <button onclick="togglePlay()">پلے / روکیں</button>
    <button onclick="splitVideo()">اسپلٹ</button>
    <button onclick="muteVideo(this)">میوٹ</button>
    <button onclick="rotateVideo()">گھمائیں</button>
    <button onclick="startAutoCaption()">🎤 آٹو کیپشن</button>
    <button onclick="stopAutoCaption()">کیپشن روکیں</button>
  </div>

  <label style="display:block;margin-top:12px">والیوم</label>
  <input type="range" min="0" max="1" step="0.1" value="1" oninput="setVolume(this.value)">

  <label style="display:block;margin-top:12px">5 - آٹو کیپشن زبان</label>
  <select id="capLang"><option value="ur-PK">اردو</option><option value="en-US">English</option><option value="ar-SA">عربی</option><option value="hi-IN">ہندی</option></select>

  <button class="btn btn-yellow" onclick="nextStep()">اگلا سٹیپ ➡️ NEXT</button>
  <button class="btn btn-teal" onclick="exportRealVideo()">EXPORT - اصلی ویڈیو سیو کریں ✅</button>
  <a id="downloadLink" style="display:none"></a>
  <p style="text-align:center;color:#aaa;font-size:12px">D CUT VIP 32 - Made by You</p>
</div>

<script>
let currentStep=1;
let selectedTool="کوئی نہیں";
let video=document.getElementById('myVideo');
let rotation=0;
let startTime=0, endTime=0;
const tools=[
["✂️","کٹ / ٹرم"],["🔗","مرج ویڈیو"],["📐","کراپ / ری سائز"],["⏩","اسپیڈ کنٹرول"],["⏪","ریورس ویڈیو"],["🔄","روٹیٹ / فلپ"],["🎨","فلٹر"],["✍️","ٹیکسٹ"],["💬","آٹو کیپشن"],["🖼️","ریموو بیک گراؤنڈ"],["🔇","نوائز ریموول"],["🎤","وائس ٹو ٹیکسٹ"],["📝","سب ٹائٹل اسٹائلنگ"],["😍","فیس بیوٹی"],["🧹","آبجیکٹ ریموور"],["🌈","آٹو کلر"],["✨","ٹرانزیشن"],["⭐","ایفیکٹس"],["🎵","میوزک"],["🔊","ساؤنڈ ایفیکٹس"],["✂️","ٹرم"],["📏","اسپلٹ"],["🗜️","کمپریس"],["🎧","ایکسٹریکٹ آڈیو"],["🔕","میوٹ"],["🔊","والیوم"],["🎙️","وائس اوور"],["🌫️","بلر"],["🖼️","بیک گراؤنڈ"],["🟩","کروما کی"],["🎥","اسٹیبلائز"],["📤","ایکسپورٹ"]
];
let grid=document.getElementById('toolGrid');
tools.forEach((t,i)=>{
  let d=document.createElement('div'); d.className='tool';
  d.innerHTML=`<div style="font-size:26px">${t[0]}</div><b>${i+1}. ${t[1]}</b><small>Tool ${i+1} - دبائیں</small>`;
  d.onclick=()=>{ document.querySelectorAll('.tool').forEach(x=>x.classList.remove('active')); d.classList.add('active'); selectedTool=t[1]; document.getElementById('currentToolText').innerText="چنا ہوا ٹول: "+selectedTool; showMsg(selectedTool+" چن لیا"); showPage('editor'); goNext(selectedTool+" کھل گیا"); };
  grid.appendChild(d);
});
function showPage(id){ document.querySelectorAll('.page').forEach(p=>p.classList.remove('active')); document.getElementById(id).classList.add('active'); window.scrollTo(0,0); }
function showMsg(m){ let s=document.getElementById('status'); s.innerText=m; s.style.display='block'; setTimeout(()=>s.style.display='none',2000); }
function goNext(txt){ currentStep++; document.getElementById('stepText').innerText=currentStep+" - "+txt; showMsg(txt); }
function nextStep(){ let steps=["ویڈیو لگائیں","ٹرم کریں","اسپیڈ چنیں","فلٹر چنیں","ٹیکسٹ / کیپشن لکھیں","ایکسپورٹ کریں"]; if(currentStep<steps.length){ currentStep++; document.getElementById('stepText').innerText=currentStep+" - "+steps[currentStep-1]; showMsg("اگلا سٹیپ: "+steps[currentStep-1]); } else { showMsg("سب ہو گیا، اب EXPORT دبائیں"); } }
function loadVideo(e){ let file=e.target.files[0]; if(file){ video.src=URL.createObjectURL(file); showPage('editor'); video.onloadedmetadata=()=>{ endTime=video.duration; document.getElementById('trimLabel').innerText="0s سے "+Math.floor(endTime)+"s تک"; }; video.play(); goNext('ویڈیو لگ گئی، اب ٹرم کریں'); } }
function togglePlay(){ if(video.paused){ video.play(); showMsg('ویڈیو چل رہی ہے'); } else { video.pause(); showMsg('ویڈیو رک گئی'); } }
function changeSpeed(v){ video.playbackRate=parseFloat(v); document.getElementById('speedLabel').innerText="اسپیڈ: "+v+"x"; }
function setFilter(f,btn){ video.style.filter=f; document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('on')); if(btn) btn.classList.add('on'); showMsg('فلٹر لگ گیا'); goNext('فلٹر ہو گیا، اب کنٹرول چنیں'); }
function muteVideo(btn){ video.muted=!video.muted; if(btn) btn.classList.toggle('on'); showMsg(video.muted?'میوٹ ہو گیا':'آواز آن ہو گئی'); }
function setVolume(v){ video.volume=parseFloat(v); video.muted=false; }
function rotateVideo(){ rotation+=90; if(rotation>=360) rotation=0; video.style.transform=`rotate(${rotation}deg)`; showMsg('ویڈیو گھوم گئی'); goNext('گھوم گئی، اب آٹو کیپشن چنیں'); }
function doTrim(){ if(!video.duration) return; let s=document.getElementById('trimStart').value; let e=document.getElementById('trimEnd').value; startTime=(s/100)*video.duration; endTime=(e/100)*video.duration; document.getElementById('trimLabel').innerText=Math.floor(startTime)+"s سے "+Math.floor(endTime)+"s تک"; video.currentTime=startTime; video.play(); showMsg('ٹرم ہو گیا'); }
function splitVideo(){ let t=video.currentTime; video.pause(); showMsg('اسپلٹ ہو گیا '+Math.floor(t)+' سیکنڈ پر'); goNext('اسپلٹ ہو گیا، اب اگلا سٹیپ'); }
let recognition=null;
function startAutoCaption(){ let lang=document.getElementById('capLang').value; let Speech=window.SpeechRecognition||window.webkitSpeechRecognition; if(!Speech){ showMsg('کروم میں کھولیں'); return; } recognition=new Speech(); recognition.lang=lang; recognition.continuous=true; recognition.interimResults=true; recognition.onresult=function(e){ let txt=''; for(let i=0;i<e.results.length;i++){ txt+=e.results[i][0].transcript; } document.getElementById('overlayText').innerText=txt; document.getElementById('textInput').value=txt; }; recognition.start(); showMsg('آٹو کیپشن چالو، اب بولیں...'); goNext('آٹو کیپشن چالو ہو گیا'); }
function stopAutoCaption(){ if(recognition) recognition.stop(); showMsg('کیپشن رک گیا'); }
function exportRealVideo(){ if(!video.src){ showMsg('پہلے ویڈیو لگائیں'); return; } showMsg('ایکسپورٹ ہو رہی ہے... رکیں'); video.currentTime=startTime; video.play(); try{ let stream=video.captureStream ? video.captureStream() : video.mozCaptureStream(); let rec=new MediaRecorder(stream,{mimeType:'video/webm'}); let chunks=[]; rec.ondataavailable=e=>{ if(e.data.size>0) chunks.push(e.data); }; rec.onstop=()=>{ let blob=new Blob(chunks,{type:'video/webm'}); let url=URL.createObjectURL(blob); let a=document.getElementById('downloadLink'); a.href=url; a.download='D-CUT-VIP-32.webm'; a.style.display='block'; a.innerText='یہاں کلک کر کے ویڈیو ڈاؤن لوڈ کریں ⬇️'; a.className='btn btn-teal'; showMsg('ایکسپورٹ ہو گئی! نیچے ڈاؤن لوڈ دبائیں'); video.pause(); }; rec.start(); setTimeout(()=>{ rec.stop(); }, (endTime-startTime)*1000 || 5000); }catch(err){ let a=document.getElementById('downloadLink'); a.href=video.src; a.download='D-CUT-VIP-32.mp4'; a.style.display='block'; a.innerText='یہاں کلک کر کے ویڈیو ڈاؤن لوڈ کریں ⬇️'; a.className='btn btn-teal'; showMsg('ایکسپورٹ تیار ہے، ڈاؤن لوڈ دبائیں'); } }
</script>
</body>
</html>
