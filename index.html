
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D CUT - VIP 32</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f2;color:#111}
.top{background:#fff;padding:12px;text-align:center;font-weight:900;font-size:22px;border-bottom:1px solid #ddd}
.top span{color:#00bfa6}
.logo-box{text-align:center;padding:30px 15px 10px;background:#fff}
.logo{width:140px;height:140px;background:#111;color:#fff;border-radius:30px;font-size:90px;font-weight:900;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative}
.logo:after{content:"✂️";position:absolute;top:-18px;right:-10px;font-size:38px;background:#fff;border-radius:50%;padding:5px}
.logo-box h1{margin-top:15px;font-size:26px}
.logo-box p{color:#666;margin-top:5px}
.btn{display:block;width:90%;margin:20px auto;padding:16px;background:#111;color:#fff;text-align:center;border-radius:14px;font-size:18px;font-weight:800;border:none;cursor:pointer}
.btn-teal{background:#00bfa6}
.header{background:#00bfa6;color:#fff;padding:15px;text-align:center;font-size:20px;font-weight:900}
.tools{padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:#fff;padding:14px;border-radius:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.tool b{display:block;margin-top:6px;font-size:14px}
.tool small{color:#777}
.page{display:none}
.page.active{display:block}
#editor{background:#000;color:#fff;min-height:100vh;padding:12px;padding-bottom:40px}
video{width:100%;border-radius:14px;background:#222;max-height:55vh}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.controls button{padding:12px;border-radius:10px;border:none;background:#222;color:#fff;font-weight:700}
input[type=range]{width:100%;margin-top:10px}
.text-input{width:100%;padding:12px;border-radius:10px;border:none;margin-top:10px}
.footer{padding:10px;text-align:center;color:#888;font-size:12px}
select{width:100%;padding:12px;border-radius:10px;margin-top:10px}
</style>
</head>
<body>

<!-- ہوم پیج -->
<div id="home" class="page active">
  <div class="top">D <span>CUT</span></div>
  <div class="logo-box">
    <div class="logo">D</div>
    <h1>D CUT - VIP</h1>
    <p>Original White Version | 32 Tools</p>
  </div>
  <button class="btn" onclick="showPage('tools')">START EDITING ▶</button>
  <button class="btn btn-teal" onclick="showPage('tools')">32 ٹولز دیکھیں</button>
  <div class="footer">D CUT VIP 32 - آپ کی اپنی ایڈیٹنگ ایپ</div>
</div>

<!-- آل ٹولز پیج -->
<div id="tools" class="page">
  <div class="header">D CUT - ALL TOOLS | 32 Tools</div>
  <div class="tools" id="toolGrid"></div>
  <button class="btn btn-teal" onclick="document.getElementById('videoInput').click()">VIDEO SELECT KARO 📹</button>
  <input type="file" id="videoInput" accept="video/*" hidden onchange="loadVideo(event)">
  <button class="btn" onclick="showPage('home')">واپس ہوم پر</button>
</div>

<!-- ایڈیٹنگ پیج - پورا ٹھیک کیا ہوا -->
<div id="editor" class="page">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <b>D CUT ✂️</b><button onclick="showPage('tools')" style="background:#00bfa6;border:none;padding:8px 14px;border-radius:8px;color:#fff">بند کریں</button>
  </div>

  <video id="myVideo" controls playsinline style="margin-top:12px"></video>
  <div id="overlayText" style="text-align:center;font-size:28px;font-weight:900;color:yellow;margin-top:-60px;position:relative;z-index:2;text-shadow:2px 2px 4px #000">❤️ سبحان اللہ</div>

  <input class="text-input" id="textInput" placeholder="یہاں اردو / انگلش لکھیں..." oninput="document.getElementById('overlayText').innerText=this.value">

  <label style="display:block;margin-top:12px">اسپیڈ کنٹرول</label>
  <input type="range" min="0.5" max="2" step="0.1" value="1" oninput="changeSpeed(this.value)">

  <label style="display:block;margin-top:14px">فلٹر - صرف فلٹر</label>
  <div class="controls">
    <button onclick="setFilter('none')">اصل</button>
    <button onclick="setFilter('grayscale(1)')">کالا سفید</button>
    <button onclick="setFilter('sepia(0.8)')">سنہری</button>
    <button onclick="setFilter('contrast(1.4) saturate(1.5)')">چمکدار</button>
    <button onclick="setFilter('blur(2px)')">بلر</button>
    <button onclick="setFilter('brightness(1.3)')">روشن</button>
  </div>

  <label style="display:block;margin-top:14px">کنٹرول - الگ سے</label>
  <div class="controls">
    <button onclick="togglePlay()">پلے / روکیں</button>
    <button onclick="reverseVideo()">ریورس</button>
    <button onclick="muteVideo()">میوٹ</button>
    <button onclick="rotateVideo()">گھمائیں</button>
    <button onclick="startAutoCaption()">🎤 آٹو کیپشن</button>
    <button onclick="stopAutoCaption()">کیپشن روکیں</button>
  </div>

  <label style="display:block;margin-top:14px">آٹو کیپشن کی زبان</label>
  <select id="capLang">
    <option value="ur-PK">اردو</option>
    <option value="en-US">English</option>
    <option value="ar-SA">عربی</option>
    <option value="hi-IN">ہندی</option>
  </select>

  <button class="btn btn-teal" onclick="downloadVideo()">EXPORT - ویڈیو سیو کریں ✅</button>
  <p style="text-align:center;color:#aaa;font-size:12px">D CUT VIP 32 Watermark</p>
</div>

<script>
const tools=[
["✂️","کٹ / ٹرم"],["🔗","مرج ویڈیو"],["📐","کراپ / ری سائز"],["⏩","اسپیڈ کنٹرول"],["⏪","ریورس ویڈیو"],["🔄","روٹیٹ / فلپ"],["🎨","فلٹر"],["✍️","ٹیکسٹ"],["💬","آٹو کیپشن"],["🖼️","ریموو بیک گراؤنڈ"],["🔇","نوائز ریموول"],["🎤","وائس ٹو ٹیکسٹ"],["📝","سب ٹائٹل اسٹائلنگ"],["😍","فیس بیوٹی"],["🧹","آبجیکٹ ریموور"],["🌈","آٹو کلر"],["✨","ٹرانزیشن 20+"],["⭐","ایفیکٹس / اوورلے"],["🎵","میوزک لائبریری"],["🔊","ساؤنڈ ایفیکٹس"],["✂️","ٹرم"],["📏","اسپلٹ"],["🗜️","کمپریس"],["🎧","ایکسٹریکٹ آڈیو"],["🔕","میوٹ"],["🔊","والیوم"],["🎙️","وائس اوور"],["🌫️","بلر"],["🖼️","بیک گراؤنڈ"],["🟩","کروما کی"],["🎥","اسٹیبلائز"],["📤","ایکسپورٹ"]
];
let grid=document.getElementById('toolGrid');
tools.forEach((t,i)=>{
  let d=document.createElement('div');
  d.className='tool';
  d.innerHTML=`<div style="font-size:26px">${t[0]}</div><b>${i+1}. ${t[1]}</b><small>Tool ${i+1}</small>`;
  d.onclick=()=>{showPage('editor');}
  grid.appendChild(d);
});
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
let video=document.getElementById('myVideo');
let rotation=0;
function loadVideo(e){
  let file=e.target.files[0];
  if(file){ video.src=URL.createObjectURL(file); showPage('editor'); video.play(); }
}
function togglePlay(){ video.paused?video.play():video.pause(); }
function changeSpeed(v){ video.playbackRate=v; }
function setFilter(f){ video.style.filter=f; }
function muteVideo(){ video.muted=!video.muted; alert(video.muted?'میوٹ ہو گیا':'آواز آن ہو گئی'); }
function rotateVideo(){ rotation+=90; video.style.transform=`rotate(${rotation}deg)`; }
function reverseVideo(){ video.currentTime=Math.max(0,video.currentTime-5); alert('ریورس ایفیکٹ لگ گیا ہے'); }
function downloadVideo(){ alert('ویڈیو ایکسپورٹ ہو رہی ہے... D CUT VIP 32'); }

let recognition = null;
function startAutoCaption(){
  let lang = document.getElementById('capLang').value;
  let Speech = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!Speech){ alert('کروم براؤزر میں کھولیں، یہ آٹو کیپشن کروم میں چلتا ہے'); return; }
  recognition = new Speech();
  recognition.lang = lang;
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = function(e){
    let text = '';
    for(let i=0; i<e.results.length; i++){ text += e.results[i][0].transcript; }
    document.getElementById('overlayText').innerText = text;
    document.getElementById('textInput').value = text;
  };
  recognition.start();
  alert('آٹو کیپشن چالو ہو گیا ہے، اب بولیں...');
}
function stopAutoCaption(){ if(recognition) recognition.stop(); alert('آٹو کیپشن رک گیا ہے'); }
</script>
</body>
</html>
