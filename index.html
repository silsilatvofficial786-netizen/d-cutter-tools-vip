<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D Cutter - All in One Tools</title>
<style>
body{margin:0;font-family:sans-serif;background:#fff;color:#111}
.header{padding:20px;text-align:center;border-bottom:1px solid #eee}
.logo{width:90px;height:90px;background:#111;color:#fff;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:900;margin:0 auto}
.logo span{color:#fff}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:16px}
.tool{background:#f7f7f7;border-radius:16px;padding:18px;text-align:center;font-weight:600;border:1px solid #eee}
.btn{width:90%;margin:20px auto;display:block;background:#111;color:#fff;padding:16px;border-radius:14px;text-align:center;font-size:18px;border:none}
.volume-box{padding:16px}
.volume-box button{margin:6px;padding:10px 14px;border-radius:10px;border:1px solid #ddd;background:#fff}
</style>
</head>
<body>
<div class="header">
<div class="logo">D✂️</div>
<h2>D Cutter - 32 Premium Tools</h2>
<p>Video | Audio | Image | PDF</p>
</div>

<div class="tools">
<div class="tool">Video Cutter</div>
<div class="tool">Audio Cutter</div>
<div class="tool">Image Converter</div>
<div class="tool">PDF Tools</div>
<div class="tool">MP3 Cutter</div>
<div class="tool">MP4 to MP3</div>
<div class="tool">Volume High</div>
<div class="tool">Volume Extra</div>
</div>

<div class="volume-box">
<h3>Volume Control System</h3>
<button>High</button>
<button>Extra</button>
<button>Low</button>
<button>Mute</button>
<button>Close Voice</button>
<button>200% - 500%</button>
</div>

<button class="btn">Download Now - 100% Success</button>
</body>
</html>
